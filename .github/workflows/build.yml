name: Build Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: macos-26
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      
      - name: Build
        run: |
          set -o pipefail
          SCHEME="SessionFlow"
          PROJECT="SessionFlow.xcodeproj"
          
          set +e
          xcodebuild -project "$PROJECT" \
                     -scheme "$SCHEME" \
                     -configuration Debug \
                     -destination 'platform=macOS,arch=arm64' \
                     clean build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED="NO" \
                     CODE_SIGNING_ALLOWED="NO" \
                     SWIFT_ENABLE_EXPLICIT_MODULES=NO \
                     2>&1 | tee xcodebuild.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "::group::Raw xcodebuild tail"
            tail -n 300 xcodebuild.log
            echo "::endgroup::"
            exit "$build_status"
          fi
